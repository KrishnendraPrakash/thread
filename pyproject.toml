[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "thread-agent"
dynamic = ["version"]
description = "Local agent core with experimental VS Code workflows and exact source-field reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = ["ruff>=0.12,<1"]
editor = ["pathspec==0.12.1", "pypdf>=6.19,<7"]

[project.scripts]
thread-agent = "thread_agent.cli.main:main"

[tool.setuptools.dynamic]
version = {attr = "thread_agent.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thread_agent = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
