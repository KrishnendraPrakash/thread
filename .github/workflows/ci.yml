name: Local workflow checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install scaffold and development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Compile source
        run: python -m compileall -q src
      - name: Behavior and development fixture tests (no model server needed)
        run: python -m unittest discover -s tests -v
      - name: CLI smoke checks
        run: |
          thread-agent --help
          thread-agent --version
          thread-agent status --json
