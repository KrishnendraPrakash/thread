name: Native automation build-only checks

on:
  push:
    branches:
      - byo-model-release-prep
      - byo-native-notice-provenance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-2025
            target: win32-x64
          - runner: windows-11-arm
            target: win32-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install native build dependencies in the CI environment
        run: python -m pip install -e ".[editor]" -r extensions/vscode/scripts/requirements-native.txt
      - name: Test distribution and native Windows source protections
        run: python -m unittest tests.editor.test_distribution tests.editor.test_runtime_install tests.editor.test_windows_filesystem tests.editor.test_marketplace_preflight tests.editor.test_marketplace_automation tests.editor.test_native_inventory tests.editor.test_native_notices tests.editor.test_distribution_provenance -v
      - name: Build and probe the native candidate
        run: |
          python extensions/vscode/scripts/freeze.py --target ${{ matrix.target }}
          python extensions/vscode/scripts/check_native.py
      - name: Test offline import with synthetic assets
        run: |
          npm ci --prefix extensions/vscode --ignore-scripts
          npm run compile --prefix extensions/vscode
          node --test extensions/vscode/out/test/offline.test.js extensions/vscode/out/test/localRuntime.test.js
      - name: Verify temporary model-free VSIX and inventory without release promotion
        env:
          THREAD_PRIVATE_PACKAGE_CI: ${{ runner.environment }}
        run: python extensions/vscode/scripts/ci_native_package.py --target ${{ matrix.target }}
