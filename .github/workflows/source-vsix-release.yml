name: Source VSIX build and protected upload

on:
  push:
    branches: [source-vsix-upload-automation]
  pull_request:
    paths:
      - '.github/workflows/source-vsix-release.yml'
      - 'extensions/vscode/**'
      - 'src/**'
      - 'release/source-vsix-policy.json'
      - 'tests/editor/test_source_release.py'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the built exact source VSIX after protected environment approval'
        type: boolean
        default: false
        required: true
      check_access:
        description: "Check the existing OIDC identity publish rights without uploading (protected main only)"
        type: boolean
        default: false
        required: true
      expected_sha256:
        description: 'Optional already reviewed package SHA-256; any mismatch stops before authentication'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: thread-source-vsix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.candidate.outputs.sha256 }}
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install existing pure-source development dependencies
        run: |
          python -m pip install -e '.[dev]' pathspec==0.12.1 pypdf==6.19.0
          npm ci --prefix extensions/vscode --ignore-scripts
      - name: Check source, package boundaries and source runtime behavior
        env:
          PYTHONPATH: src
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m unittest discover -s tests -v
          python extensions/vscode/scripts/bundle.py
          npm test --prefix extensions/vscode
      - name: Build once and validate the actual universal source VSIX
        id: candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha256 }}
        run: |
          python extensions/vscode/scripts/source_package.py build --output build/source-candidate
          python - <<'PY'
          import json, os
          from pathlib import Path
          record = json.loads(Path('build/source-candidate/thread-agent-0.2.1-source.receipt.json').read_text())
          sha = record['targets'][0]['vsix']['sha256']
          expected = os.environ.get('EXPECTED_SHA', '')
          if expected and expected != sha:
              raise SystemExit('Source candidate differs from reviewed SHA-256')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'sha256={sha}\nartifact_name=thread-source-candidate-{os.environ["GITHUB_RUN_ID"]}-{os.environ["GITHUB_RUN_ATTEMPT"]}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Universal source VSIX; stable channel; Python 3.9+ required; no native/model payload.\n\n')
              stream.write(f'Commit: `{os.environ["GITHUB_SHA"]}`\n\nSHA-256: `{sha}`\n\n')
              stream.write(f'VSIX bytes: {record["targets"][0]["vsix"]["bytes"]}\n\n')
              stream.write('No publication or Azure authentication in this build job.\n')
          PY
      - name: Verify default upload mode is a local read-only plan
        run: python extensions/vscode/scripts/source_upload.py --package build/source-candidate/thread-agent-0.2.1-source.vsix --commit "$GITHUB_SHA" --sha256 '${{ steps.candidate.outputs.sha256 }}'
      - name: Retain exact candidate for explicit dispatch review/promotion only
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: build/source-candidate/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.check_access) && github.ref == 'refs/heads/main'
    environment: marketplace-publish
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: candidate
      - name: Recheck exact candidate before requesting identity
        run: |
          python extensions/vscode/scripts/source_package.py verify --package candidate/thread-agent-0.2.1-source.vsix --commit "$GITHUB_SHA" --sha256 '${{ needs.build.outputs.sha256 }}'
          npm ci --prefix extensions/vscode --ignore-scripts
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Read-only check of this exact publishing identity's Contributor access
        run: node extensions/vscode/node_modules/@vscode/vsce/vsce verify-pat --azure-credential Krishnendra
      - name: Upload the verified existing package bytes in the stable channel
        if: inputs.publish
        env:
          THREAD_SOURCE_PUBLISH_APPROVED: github-protected-main
        run: python extensions/vscode/scripts/source_upload.py --package candidate/thread-agent-0.2.1-source.vsix --commit "$GITHUB_SHA" --sha256 '${{ needs.build.outputs.sha256 }}' --execute
      - name: Retain upload receipt and uncertain-state evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: thread-source-upload-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-upload-ledger.json
          if-no-files-found: warn
          retention-days: 30
