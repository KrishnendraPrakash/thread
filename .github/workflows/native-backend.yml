name: Validate native backend candidates

on:
  push:
    branches:
      - native-distribution-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-2025
            target: win32-x64
          - runner: windows-11-arm
            target: win32-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install native build dependencies in the CI environment
        run: python -m pip install -e ".[editor]" -r extensions/vscode/scripts/requirements-native.txt
      - name: Test distribution and native Windows source protections
        run: python -m unittest tests.editor.test_distribution tests.editor.test_runtime_install tests.editor.test_windows_filesystem -v
      - name: Build and probe the native candidate
        run: |
          python extensions/vscode/scripts/freeze.py --target ${{ matrix.target }}
          python extensions/vscode/scripts/check_native.py > native-check-${{ matrix.target }}.txt
      - name: Test offline import with synthetic assets
        run: |
          npm ci --prefix extensions/vscode --ignore-scripts
          npm run compile --prefix extensions/vscode
          node --test extensions/vscode/out/test/offline.test.js
      - uses: actions/upload-artifact@v7
        with:
          name: native-validation-metadata-${{ matrix.target }}
          # Binary redistribution remains gated on complete dependency notices/licensing.
          path: |
            native-check-${{ matrix.target }}.txt
            extensions/vscode/native/${{ matrix.target }}/thread-backend/notices/provenance.json
          if-no-files-found: error
          retention-days: 7
