name: Private real runtime integration x64

# Called only by the existing registered manual dispatcher with an explicit suite.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  runtime:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: win32-x64
          - runner: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Stop before runtime/model downloads if actual free storage is insufficient
        env:
          THREAD_RUNTIME_CI_ENVIRONMENT: ${{ runner.environment }}
          THREAD_RUNTIME_WORK: ${{ runner.temp }}/thread-runtime-integration
        run: python extensions/vscode/scripts/ci_runtime_integration.py preflight --target ${{ matrix.target }} --work "${{ runner.temp }}/thread-runtime-integration"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Use only existing approved native/editor build dependencies
        env:
          THREAD_RUNTIME_CI_ENVIRONMENT: ${{ runner.environment }}
          THREAD_RUNTIME_WORK: ${{ runner.temp }}/thread-runtime-integration
        run: python -m pip install -e ".[editor]" -r extensions/vscode/scripts/requirements-native.txt
      - name: Build and probe the actual host-native backend
        env:
          THREAD_RUNTIME_CI_ENVIRONMENT: ${{ runner.environment }}
          THREAD_RUNTIME_WORK: ${{ runner.temp }}/thread-runtime-integration
        run: |
          python extensions/vscode/scripts/freeze.py --target ${{ matrix.target }}
          python extensions/vscode/scripts/check_native.py
          npm ci --prefix extensions/vscode --ignore-scripts
          npm run compile --prefix extensions/vscode
      - name: Acquire and extract the exact runtime through the actual native installer
        env:
          THREAD_RUNTIME_CI_ENVIRONMENT: ${{ runner.environment }}
          THREAD_RUNTIME_WORK: ${{ runner.temp }}/thread-runtime-integration
        run: node extensions/vscode/scripts/ci-runtime-integration.cjs install "${{ runner.temp }}/thread-runtime-integration" ${{ matrix.target }}
      - name: Inventory target binaries and stop for any additional vendor agreement before execution
        env:
          THREAD_RUNTIME_CI_ENVIRONMENT: ${{ runner.environment }}
          THREAD_RUNTIME_WORK: ${{ runner.temp }}/thread-runtime-integration
        run: python extensions/vscode/scripts/ci_runtime_integration.py audit --target ${{ matrix.target }} --work "${{ runner.temp }}/thread-runtime-integration"
      - name: Acquire only the approved manifest and exact config/model/license blobs
        env:
          THREAD_RUNTIME_CI_ENVIRONMENT: ${{ runner.environment }}
          THREAD_RUNTIME_WORK: ${{ runner.temp }}/thread-runtime-integration
        run: python extensions/vscode/scripts/ci_runtime_integration.py model --target ${{ matrix.target }} --work "${{ runner.temp }}/thread-runtime-integration"
      - name: Run owned CPU completion and unchanged production request, then clean up owned processes
        env:
          THREAD_RUNTIME_CI_ENVIRONMENT: ${{ runner.environment }}
          THREAD_RUNTIME_WORK: ${{ runner.temp }}/thread-runtime-integration
        run: node extensions/vscode/scripts/ci-runtime-integration.cjs run "${{ runner.temp }}/thread-runtime-integration" ${{ matrix.target }}
